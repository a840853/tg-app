<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>发布商品</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #17212b; color: #ffffff; padding: 16px; margin: 0; font-size: 14px; }
        h2 { text-align: center; margin-top: 0; margin-bottom: 20px; font-size: 18px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #8e9ca8; font-size: 13px; font-weight: 500; }
        label span { color: #ff5252; }
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #242f3d;
            background-color: #242f3d; color: #fff; font-size: 14px; outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: #ff6b35; }
        
        .type-switch { display: flex; gap: 10px; }
        .type-btn {
            flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #242f3d;
            background: #242f3d; color: #fff; text-align: center; cursor: pointer; font-weight: bold;
        }
        .type-btn.active { background: #ff6b35; border-color: #ff6b35; }

        .media-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
        .upload-box {
            width: 80px; height: 80px; border: 2px dashed #3a4756; border-radius: 8px;
            background: #242f3d; display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer; color: #8e9ca8; font-size: 11px; text-align: center;
        }
        .upload-box:hover { border-color: #ff6b35; color: #ff6b35; }
        .preview-item {
            width: 80px; height: 80px; border-radius: 8px; position: relative; overflow: hidden;
            border: 1px solid #3a4756; background: #000;
        }
        .preview-item img, .preview-item video { width: 100%; height: 100%; object-fit: cover; }
        .preview-item .remove-btn {
            position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7);
            color: #ff5252; width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; cursor: pointer; line-height: 1; z-index: 10;
        }
        .video-badge {
            position: absolute; bottom: 2px; left: 2px; background: rgba(0,0,0,0.6);
            color: #fff; font-size: 10px; padding: 2px 4px; border-radius: 3px; z-index: 5;
        }

        .buy-notice {
            background: #242f3d; padding: 12px; border-radius: 8px; color: #ff9800;
            font-size: 13px; margin-bottom: 16px; border-left: 4px solid #ff9800; display: none;
        }

        .row { display: flex; gap: 10px; }
        .col { flex: 1; }

        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag-btn {
            padding: 8px 14px; border-radius: 6px; background: #242f3d; color: #fff;
            font-size: 13px; cursor: pointer; border: 1px solid transparent; user-select: none;
        }
        .tag-btn.active { background: #3a4756; border-color: #ff6b35; color: #ff6b35; }

        .submit-btn {
            width: 100%; padding: 14px; background-color: #ff6b35; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            margin-top: 20px; cursor: pointer;
        }
        .submit-btn:disabled { background-color: #555; cursor: not-allowed; }
        .sub-text { font-size: 11px; color: #7f8c8d; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>
    <h2>发布商品</h2>
    
    <div class="form-group">
        <label>类型</label>
        <div class="type-switch">
            <div class="type-btn active" onclick="selectType('出售', this)">出售</div>
            <div class="type-btn" onclick="selectType('求购', this)">求购</div>
        </div>
    </div>

    <div id="mediaContainer">
        <div class="form-group">
            <label>商品图片 (第一张为封面，最多9张)</label>
            <input type="file" id="imageInput" accept="image/*" multiple style="display:none;" onchange="handleImageSelect(event)">
            <div class="media-grid" id="imagePreviewGrid"></div>
            <div class="upload-box" id="imageUploadBox" onclick="triggerImageInput()" style="margin-top: 8px;">
                <span style="font-size: 20px;">+</span>
                <span>添加图片</span>
            </div>
        </div>

        <div class="form-group">
            <label>视频 (可选，1个，限制50MB以内)</label>
            <input type="file" id="videoInput" accept="video/mp4,video/mov,video/quicktime,video/*" style="display:none;" onchange="handleVideoSelect(event)">
            <div class="media-grid" id="videoPreviewContainer"></div>
            <div class="upload-box" id="videoUploadBox" onclick="triggerVideoInput()" style="margin-top: 8px;">
                <span style="font-size: 20px;">+</span>
                <span>添加视频</span>
            </div>
        </div>
    </div>

    <div class="buy-notice" id="buyNotice">
        📌 求购信息将自动使用平台专属【求购】封面图统一发布。
    </div>

    <div class="form-group">
        <label>标题 <span>*</span></label>
        <input type="text" id="title" placeholder="例如：iPhone 15 Pro / 厨房用品">
    </div>

    <div class="row">
        <div class="col form-group">
            <label>价格 <span>*</span></label>
            <input type="text" id="price" placeholder="如：私聊 / 680 美元">
        </div>
        <div class="col form-group">
            <label>城市 <span>*</span></label>
            <select id="city">
                <option value="西港">西港</option>
                <option value="金边">金边</option>
                <option value="波贝">波贝</option>
                <option value="木牌">木牌</option>
                <option value="戈公">戈公</option>
                <option value="拜林">拜林</option>
                <option value="菩萨">菩萨</option>
                <option value="财通">财通</option>
                <option value="磅湛">磅湛</option>
                <option value="暹粒">暹粒</option>
                <option value="贡布">贡布</option>
                <option value="白马">白马</option>
                <option value="其他">其他</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>详细地址 (可不填)</label>
        <input type="text" id="address" placeholder="如 万达 / 街道 / 小区">
    </div>

    <div class="form-group">
        <label>联系方式 <span>*</span></label>
        <input type="text" id="contact" placeholder="@你的用户名 或 电话">
    </div>

    <div class="form-group">
        <label>商品类别</label>
        <select id="category">
            <option value="生活闲置">生活闲置</option>
            <option value="手机数码">手机数码</option>
            <option value="电脑办公">电脑办公</option>
            <option value="汽车摩托">汽车摩托</option>
            <option value="房屋出租">房屋出租</option>
            <option value="家具家电">家具家电</option>
            <option value="音响乐器">音响乐器</option>
            <option value="服饰鞋包">服饰鞋包</option>
            <option value="渔具户外">渔具户外</option>
            <option value="其他">其他</option>
        </select>
    </div>

    <div class="form-group">
        <label>成色 / 标签</label>
        <div class="tags-container">
            <div class="tag-btn" onclick="toggleTag(this)">全新</div>
            <div class="tag-btn" onclick="toggleTag(this)">99新</div>
            <div class="tag-btn" onclick="toggleTag(this)">95新</div>
            <div class="tag-btn" onclick="toggleTag(this)">9成新</div>
            <div class="tag-btn" onclick="toggleTag(this)">8成新</div>
            <div class="tag-btn" onclick="toggleTag(this)">急出</div>
            <div class="tag-btn" onclick="toggleTag(this)">可小刀</div>
            <div class="tag-btn" onclick="toggleTag(this)">带包装</div>
            <div class="tag-btn" onclick="toggleTag(this)">带票</div>
        </div>
    </div>

    <div class="form-group">
        <label>物品介绍</label>
        <textarea id="desc" rows="4" placeholder="描述物品成色、规格、交易方式等..."></textarea>
    </div>

    <button class="submit-btn" id="submitBtn">提交审核</button>
    <div class="sub-text">提交后将由管理员审核，审核通过后自动同步发布至频道。</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BOT_TOKEN = "8736209511:AAEU6dzUEOmrls3-wVh2uZ88l9nwviZ-kX4";
        const ADMIN_ID = "7446549590";

        let selectedType = '出售';
        let selectedImages = [];
        let selectedVideo = null;

        function selectType(type, el) {
            selectedType = type;
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');

            const mediaContainer = document.getElementById('mediaContainer');
            const buyNotice = document.getElementById('buyNotice');

            if (type === '求购') {
                mediaContainer.style.display = 'none';
                buyNotice.style.display = 'block';
            } else {
                mediaContainer.style.display = 'block';
                buyNotice.style.display = 'none';
            }
        }

        function toggleTag(el) {
            el.classList.toggle('active');
        }

        function triggerImageInput() {
            if (selectedImages.length >= 9) {
                alert('最多上传 9 张图片');
                return;
            }
            document.getElementById('imageInput').click();
        }

        function handleImageSelect(e) {
            const files = Array.from(e.target.files);
            for (let file of files) {
                if (selectedImages.length >= 9) break;
                if (file.size > 10 * 1024 * 1024) {
                    alert(`图片 [${file.name}] 超过 10MB，已被跳过`);
                    continue;
                }
                selectedImages.push(file);
            }
            e.target.value = '';
            renderImagePreviews();
        }

        function removeImage(index) {
            selectedImages.splice(index, 1);
            renderImagePreviews();
        }

        function renderImagePreviews() {
            const container = document.getElementById('imagePreviewGrid');
            container.innerHTML = '';
            selectedImages.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                const removeBtn = document.createElement('div');
                removeBtn.className = 'remove-btn';
                removeBtn.innerText = '×';
                removeBtn.onclick = (e) => { e.stopPropagation(); removeImage(index); };
                div.appendChild(img);
                div.appendChild(removeBtn);
                container.appendChild(div);
            });
            document.getElementById('imageUploadBox').style.display = selectedImages.length >= 9 ? 'none' : 'flex';
        }

        function triggerVideoInput() {
            document.getElementById('videoInput').click();
        }

        function handleVideoSelect(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 50 * 1024 * 1024) {
                    alert('视频不能超过 50MB！请压缩后再试。');
                    e.target.value = '';
                    return;
                }
                selectedVideo = file;
                renderVideoPreview();
            }
            e.target.value = '';
        }

        function removeVideo() {
            selectedVideo = null;
            renderVideoPreview();
        }

        function renderVideoPreview() {
            const container = document.getElementById('videoPreviewContainer');
            container.innerHTML = '';
            const uploadBox = document.getElementById('videoUploadBox');
            if (selectedVideo) {
                uploadBox.style.display = 'none';
                const div = document.createElement('div');
                div.className = 'preview-item';
                
                const video = document.createElement('video');
                video.src = URL.createObjectURL(selectedVideo);
                video.setAttribute('playsinline', '');
                video.setAttribute('muted', '');
                video.setAttribute('autoplay', '');
                video.loop = true;

                const badge = document.createElement('div');
                badge.className = 'video-badge';
                badge.innerText = '🎬 视频';

                const removeBtn = document.createElement('div');
                removeBtn.className = 'remove-btn';
                removeBtn.innerText = '×';
                removeBtn.onclick = (e) => { e.stopPropagation(); removeVideo(); };
                
                div.appendChild(video);
                div.appendChild(badge);
                div.appendChild(removeBtn);
                container.appendChild(div);
            } else {
                uploadBox.style.display = 'flex';
            }
        }

        document.getElementById('submitBtn').addEventListener('click', async function() {
            const submitBtn = document.getElementById('submitBtn');
            
            const title = document.getElementById('title').value.trim();
            const price = document.getElementById('price').value.trim();
            const city = document.getElementById('city').value;
            const address = document.getElementById('address').value.trim();
            const contact = document.getElementById('contact').value.trim();
            const category = document.getElementById('category').value;
            const desc = document.getElementById('desc').value.trim();
            const tags = Array.from(document.querySelectorAll('.tag-btn.active')).map(el => el.innerText);

            if (!title || !price || !contact) {
                alert('请填写完整带 * 的必填项！');
                return;
            }

            const userId = tg.initDataUnsafe?.user?.id;
            const userName = tg.initDataUnsafe?.user?.first_name || '用户';
            if (!userId) {
                alert('请在 Telegram 客户端内打开小程序！');
                return;
            }

            submitBtn.innerText = "正在准备提交...";
            submitBtn.disabled = true;

            try {
                let mediaType = 'none';
                let mediaItems = [];

                if (selectedType === '出售') {
                    let allFiles = [];
                    selectedImages.forEach(img => allFiles.push({ type: 'photo', file: img }));
                    if (selectedVideo) {
                        allFiles.push({ type: 'video', file: selectedVideo });
                    }

                    if (allFiles.length === 1) {
                        const item = allFiles[0];
                        const formData = new FormData();
                        formData.append('chat_id', ADMIN_ID);

                        if (item.type === 'photo') {
                            submitBtn.innerText = "正在上传图片...";
                            formData.append('photo', item.file);
                            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData }).then(r => r.json());
                            if (res.ok) {
                                mediaType = 'photo';
                                mediaItems.push(`photo:${res.result.photo.pop().file_id}`);
                            } else {
                                alert("图片上传失败：" + (res.description || "未知错误"));
                                submitBtn.innerText = "提交审核";
                                submitBtn.disabled = false;
                                return;
                            }
                        } else {
                            submitBtn.innerText = "正在上传视频...";
                            formData.append('video', item.file);
                            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: formData }).then(r => r.json());
                            if (res.ok) {
                                mediaType = 'video';
                                mediaItems.push(`video:${res.result.video.file_id}`);
                            } else {
                                alert("视频上传失败：" + (res.description || "请检查视频格式或文件大小"));
                                submitBtn.innerText = "提交审核";
                                submitBtn.disabled = false;
                                return;
                            }
                        }
                    } else if (allFiles.length > 1) {
                        submitBtn.innerText = `正在上传 ${allFiles.length} 个媒体文件...`;
                        const formData = new FormData();
                        formData.append('chat_id', ADMIN_ID);

                        const mediaArray = allFiles.map((item, i) => {
                            formData.append(`file${i}`, item.file);
                            return { type: item.type, media: `attach://file${i}` };
                        });
                        formData.append('media', JSON.stringify(mediaArray));

                        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup`, { method: 'POST', body: formData }).then(r => r.json());

                        if (res.ok) {
                            mediaType = 'group';
                            res.result.forEach((msg) => {
                                if (msg.photo && msg.photo.length > 0) {
                                    mediaItems.push(`photo:${msg.photo[msg.photo.length - 1].file_id}`);
                                } else if (msg.video) {
                                    mediaItems.push(`video:${msg.video.file_id}`);
                                }
                            });
                        } else {
                            alert("文件上传失败：" + (res.description || "请检查文件大小或格式"));
                            submitBtn.innerText = "提交审核";
                            submitBtn.disabled = false;
                            return;
                        }
                    }
                } else if (selectedType === '求购') {
                    mediaType = 'buy';
                }

                let hiddenMediaTag = '';
                if (mediaType !== 'none') {
                    const idsParam = mediaItems.length > 0 ? `&ids=${mediaItems.join(',')}` : '';
                    hiddenMediaTag = `<a href="https://tgmedia.app/?type=${mediaType}${idsParam}">&#8203;</a>`;
                }

                const itemLabel = selectedType === '求购' ? '求购物品' : '出售物品';
                const addressStr = address ? ` ${address}` : '';
                const tagStr = tags.length > 0 ? `\n成色标签：${tags.join('、')}` : '';

                const formattedContent = 
                    `${itemLabel}：${title}\n` +
                    `价        格：${price}\n` +
                    `商品类别：#${category}\n` +
                    `位        置：#${city}${addressStr}\n` +
                    `联系方式：${contact}\n` +
                    `交易方式：自取/送货上门\n` +
                    `物品介绍：${desc || '无'}${tagStr}`;

                const adminText = 
                    `${hiddenMediaTag}🆕 <b>收到新的【${selectedType}】投稿等待审核：</b>\n\n` +
                    `${formattedContent}\n\n` +
                    `👤 <b>投稿人：</b> ${userName} (ID: <code>${userId}</code>)`;

                const userText = 
                    `✅ <b>投稿提交成功！</b>\n\n` +
                    `您的【${selectedType}】信息已提交审核，通过后将自动发布到频道 @djkkzz。`;

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: userId, text: userText, parse_mode: 'HTML' })
                });

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_ID,
                        text: adminText,
                        parse_mode: 'HTML',
                        reply_markup: {
                            inline_keyboard: [
                                [
                                    { text: "✅ 通过并发布到频道", callback_data: `approve|${userId}` },
                                    { text: "❌ 拒绝投稿", callback_data: `reject|${userId}` }
                                ]
                            ]
                        }
                    })
                });

                tg.close();
            } catch (err) {
                alert('提交失败，请检查网络或更换视频重试');
                submitBtn.innerText = "提交审核";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
